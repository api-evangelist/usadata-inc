aid: usadata-inc
name: USADATA, Inc.
description: USADATA is a data and marketing intelligence company founded in 1998 and
  headquartered in New York City, backed by Insight Partners. It maintains a database of
  260+ million US consumer records, 15+ million businesses, and 190 million households,
  updated monthly, and provides audience intelligence, data enrichment, hygiene, and
  omnichannel campaign activation. Products include the SL360 self-serve audience
  platform, Hailey AI conversational audience builder, a white-label Leads Portal with
  an embeddable Leads Module, and RESTful APIs for real-time and batch enrichment,
  audience building, hygiene (address standardization, NCOA, dedup, deceased
  suppression), and matchback attribution, with integrations into Salesforce, HubSpot,
  Marketo, and other CRM and marketing platforms. One machine-readable contract is
  published — the Leads Engine SOAP service at leadsengine.usadata.com serves a WSDL
  anonymously declaring 24 operations for counts, pricing, ordering, suppression,
  address lookup and geography. The REST APIs the marketing site advertises publish no
  spec, and API credentials are sales-gated with no developer portal, no reference
  documentation and no self-service sign-up.
