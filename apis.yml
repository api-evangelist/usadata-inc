apis:
- aid: usadata-inc:leads-engine
  name: USADATA Leads Engine Service (SOAP)
  description: >-
    Publicly served SOAP 1.1 / 1.2 web service behind the USADATA Leads Portal
    and Leads Module. The WSDL is served anonymously from the production API
    host and declares 24 operations covering the full list-brokerage workflow:
    table and column discovery (getTableList, getTableDefinition), synchronous
    and asynchronous audience counts and saturation (carrier-route) counts,
    cross-tab matrix reports, prior-order suppression, order pricing, order
    submission, order status and cancellation, address lookup with geocoding,
    and state/county/city/ZIP geography lookups. Authentication is a Login
    {UserID, Password, ClientID} element carried in the SOAP body; ping and
    getVersion answer anonymously. Credentials are issued by USADATA through
    sales / developer support — there is no self-service sign-up.
  humanURL: https://leadsengine.usadata.com/service.asmx
  baseURL: https://leadsengine.usadata.com/service.asmx
