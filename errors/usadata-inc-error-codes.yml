format: soap-result-envelope
description: >-
  USADATA Leads Engine does not use RFC 9457 problem+json, and it does not use
  SOAP faults as its primary error channel. Every operation returns a normal
  200 response whose result object carries an integer return code plus a free-text
  error string. That means an agent MUST inspect the body: HTTP status alone is
  not an error signal on this API. The code registry itself (which integer means
  what) is not published — only the envelope shape is machine-readable.
